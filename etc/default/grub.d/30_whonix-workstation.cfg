GRUB_DISTRIBUTOR="Whonix-Workstation"

## Theme and resolution.
##
## The variant is selected HERE, at grub-mkconfig time, rather than shipped as a
## dpkg symlink: when the package is installed /boot may not be mounted yet, and
## a /boot that is itself a symlink makes a packaged link under it fail.
## grub-mkconfig runs on a system where /boot IS mounted, so both hazards are
## avoided.
##
## 'cp', not 'ln': a symlink under /boot carries the same hazards, and a copy is
## inert -- nothing downstream has to resolve it. '--remove-destination' unlinks
## an existing destination before writing, so a background.png that is a SYMLINK
## is replaced rather than written THROUGH, which would corrupt its target.
##
## Unconditional: a condition evaluated here reads the BUILD HOST, because
## grub-mkconfig runs inside the build chroot and help-steps/chroot-raw mounts a
## fresh sysfs there. A '/sys/firmware/efi' test therefore reports the firmware of
## the machine doing the building, not the machine that will boot the image: two
## build hosts produce two different images from identical source, and a
## BIOS-booted build host stamps the 4:3 theme onto every image whatever display
## it will run on. Firmware type does not indicate panel aspect ratio either way.
##
## 16:9 is the near-universal panel shape; a 4:3 screen letterboxes the background
## rather than failing.
##
## ',auto' is a documented GRUB feature. GRUB manual, "15.1.12 gfxmode": "The
## resolution may be specified as a sequence of one or more modes, separated by
## commas (',') or semicolons (';'); each will be tried in turn until one is
## found. Each mode should be either 'auto', 'WIDTHxHEIGHT', or
## 'WIDTHxHEIGHTxDEPTH'." grub-mkconfig passes the value through verbatim
## ('set gfxmode=${GRUB_GFXMODE}' in /etc/grub.d/00_header), so firmware that
## cannot set 1280x720 falls back to grub's own choice instead of an unreadable
## console.
cp --remove-destination -- \
   "/boot/grub/themes/whonix-workstation/background-16x9.png" \
   "/boot/grub/themes/whonix-workstation/background.png"
cp --remove-destination -- \
   "/boot/grub/themes/whonix-workstation/theme-16x9.txt" \
   "/boot/grub/themes/whonix-workstation/theme.txt"

GRUB_THEME="/boot/grub/themes/whonix-workstation/theme.txt"
GRUB_GFXMODE=1280x720,auto
