GRUB_DISTRIBUTOR="Whonix-Workstation"

## Theme and resolution.
##
## The rationale is NOT repeated here: why the variant is selected at
## grub-mkconfig time rather than shipped as a dpkg symlink, why 'cp' with
## '--remove-destination' rather than 'ln', why the choice is unconditional
## (a condition evaluated here reads the BUILD HOST), and why ',auto' is a
## documented GRUB fallback -- all of it lives in ONE place:
##
##   kicksecure-base-files, etc/default/grub.d/30_kicksecure.cfg
##
## Three copies of the same thirty lines drift, and had already begun to. Only
## the theme directory name below is specific to this package.
cp --remove-destination -- \
   "/boot/grub/themes/whonix-workstation/background-16x9.png" \
   "/boot/grub/themes/whonix-workstation/background.png"
cp --remove-destination -- \
   "/boot/grub/themes/whonix-workstation/theme-16x9.txt" \
   "/boot/grub/themes/whonix-workstation/theme.txt"

GRUB_THEME="/boot/grub/themes/whonix-workstation/theme.txt"
GRUB_GFXMODE=1280x720,auto
