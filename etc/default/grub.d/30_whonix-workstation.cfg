GRUB_DISTRIBUTOR="Whonix-Workstation"
GRUB_THEME="/boot/grub/themes/whonix-workstation/theme.txt"

## Theme and resolution.
##
## During a derivative-maker build 'dist_build_grub_bios_theme=true' forces the
## 4x3/BIOS variant, so the image is reproducible regardless of build-host
## firmware: grub-mkconfig runs in the chroot and would otherwise read the BUILD
## HOST's /sys/firmware/efi. The variable is absent on an installed system, so a
## later update-grub falls back to probing the running machine's firmware.
rm -f /boot/grub/themes/whonix-workstation/background.png
rm -f /boot/grub/themes/whonix-workstation/theme.txt
if [ "${dist_build_grub_bios_theme:-}" != "true" ] && [ -d /sys/firmware/efi ]; then
   ## Can't use "ln" here, /boot may be a FAT32 partition.
   cp -- /boot/grub/themes/whonix-workstation/background-16x9.png /boot/grub/themes/whonix-workstation/background.png
   cp -- /boot/grub/themes/whonix-workstation/theme-16x9.txt /boot/grub/themes/whonix-workstation/theme.txt
   GRUB_GFXMODE="1280x720,auto"
else
   cp -- /boot/grub/themes/whonix-workstation/background-4x3.png /boot/grub/themes/whonix-workstation/background.png
   cp -- /boot/grub/themes/whonix-workstation/theme-4x3.txt /boot/grub/themes/whonix-workstation/theme.txt
   GRUB_GFXMODE="1024x768,auto"
fi
